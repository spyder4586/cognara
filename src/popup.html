<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cognara</title>
<style>
  body { width: 220px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .logo { width: 24px; height: 24px; }
  .label { flex: 1; font-size: 14px; }
  .switch input { width: 18px; height: 18px; }
  .hint { margin-top: 8px; font-size: 12px; color: #555; }
</style>
</head>
<body>
<header class="row">
<img class="logo" src="../icons/icon48.png" alt="Cognara logo" width="24" height="24">
<span>Cognara</span>
</header>
<div class="row" style="margin-top: 12px;">
<label class="label" for="enabledToggle">Hide Shorts</label>
<span class="switch">
<input type="checkbox" id="enabledToggle" role="switch" aria-label="Hide Shorts" checked>
</span>
</div>
<p class="hint" id="statusText">Shorts surfaces are hidden.</p>
<script src="popup.js"></script>
</body>
</html>
